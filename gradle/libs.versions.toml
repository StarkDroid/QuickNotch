[versions]
compose-multiplatform = "1.7.3"
# Skiko is pinned rather than left to Compose's transitive default: 0.8.18
# (CMP 1.7.3's own choice) SIGTRAPs the macOS Metal backend on macOS 26/27 —
# its MetalRedrawer.createMetalDevice runs on the AWT EDT and trips the
# WindowServer "must only be used from the main thread" assertion. 0.8.25
# fixed it, and it is what puts the settings window on the GPU (~20x less
# CPU per scroll frame). Never downgrade without re-reading the pitfall in
# agents.md section 10.
skiko = "0.8.25"
kotlin = "2.1.10"
# Static analysis: detekt 1.23.8 is the last stable line and the newest one
# whose Gradle API still loads under this repo's Gradle 8.9 wrapper (2.x is
# alpha-only). Its embedded Kotlin (2.0.21) parses our sources fine — we use
# no 2.1-only syntax. Never float this without re-running :composeApp:detekt.
detekt = "1.23.8"
kotlinx-coroutines = "1.10.1"
kotlinx-serialization = "1.7.3"
ktor = "3.1.3"
jna = "5.16.0"
# Every Ktor module brings slf4j-api in transitively with no provider, so
# every run printed "No SLF4J providers were found" ×3. The
# NOP binding is the provider that warning asks for: same 2.0.16 line the api
# resolves to, no behaviour change (nothing in the app logs through slf4j),
# just the three warning lines gone from the console.
slf4j = "2.0.16"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }
slf4j-nop = { group = "org.slf4j", name = "slf4j-nop", version.ref = "slf4j" }

ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version = "0.6.2" }

[plugins]
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
