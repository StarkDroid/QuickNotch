# The Cloudflare Worker that serves quicknotch.app.
#
# The site is fully static: `npm run build` writes prerendered HTML and assets
# to `build/`, and the Worker serves that directory from the edge, with no
# server rendering and no database. `worker/site.js` exists only to send
# `www.quicknotch.app` to the apex with a 301; every apex request is handed to
# the assets binding.
#
# Deploys come from the repository's Cloudflare build (root directory `web`,
# build command `npm run build`, deploy command `npx wrangler deploy`) or from
# this machine with `npx wrangler deploy` in `web/`.
name = "quicknotch"
main = "worker/site.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./build"
# Named so the handler can serve anything that is not the www host.
binding = "ASSETS"
# A missing route serves `404.html` from the build with a real 404 status.
not_found_handling = "404-page"
# The handler runs first so it can answer the www host before assets do.
run_worker_first = true
