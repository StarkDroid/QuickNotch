# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

# Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8

# Allow packaging with Homebrew OpenJDK 17 on this machine
compose.desktop.packaging.checkJdkVendor=false

# Keep Gradle's build cache off. It is the deserialization surface in the
# Kotlin build-cache advisory, and this project does not need it.
org.gradle.caching=false
