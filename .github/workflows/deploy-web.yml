name: Deploy site

# Type-checks and builds the site, then deploys it to the `quicknotch` Worker on
# Cloudflare (quicknotch.app).
#
# The repository's own Cloudflare build is the primary path: it runs on every
# push to `main` from the repository root, with build command `npm run build`
# (which delegates to `web/`) and deploy command `npx wrangler deploy` (which
# reads the root `wrangler.toml`). This job is the fallback for when that
# integration is unavailable, so it deploys only when run by hand.
#
# Two secrets are required for the deploy step:
#   CLOUDFLARE_API_TOKEN   Workers Scripts: Edit permission
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the zone
# Without them the build still runs (so a broken site fails CI) and the deploy
# step is skipped with a warning.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "package.json"
      - "wrangler.toml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Check
        working-directory: web
        run: npm run check

      - name: Build
        working-directory: web
        run: npm run build

      - name: Deploy credentials
        id: credentials
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Push builds only validate the site; the Cloudflare build deploys it."
          elif [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare secrets are missing; the built site was not deployed."
          fi

      - name: Deploy to Cloudflare
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
